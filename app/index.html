<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Clean Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div id="greeting"></div>
        <div id="clock"></div>
        <div id="date"></div>
    </header>

    <main>
        <div id="focus-name"></div>

        <section>
            <h2>Favourites</h2>
            <div id="dock" class="row"></div>
            <p id="dock-empty" class="hint">Hold OK on any app below to add it here.</p>
        </section>

        <section id="inputs-section">
            <h2>Inputs</h2>
            <div id="inputs" class="row"></div>
        </section>

        <section>
            <h2>All apps</h2>
            <div id="grid" class="grid"></div>
        </section>
    </main>

    <footer class="hint">Hold OK to add or remove a favourite · Back closes an input</footer>

    <div id="toast"></div>
    <script src="js/main.js"></script>
</body>
</html>
